services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/home/dev/.composer/cache
    tty: true
    ports:
      - "8000:8000"
    stdin_open: true
    command: ["sleep", "infinity"]

volumes:
  composer-cache:
